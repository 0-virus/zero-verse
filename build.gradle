plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.zeroverse'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // X-deployment S3 direct upload/read. Keep the version aligned with the approved U0 SDK.
    implementation platform('software.amazon.awssdk:bom:2.49.6')
    implementation 'software.amazon.awssdk:s3'

    // M4 content safety/upload byte detection. Versions are pinned to published
    // Maven Central releases; product code does not use the independent U0 project.
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260102.1'
    implementation 'org.apache.tika:tika-core:3.3.2'

    // JWT (ADR-0003) — api만 컴파일에 노출하고 구현체는 런타임으로 제한한다.
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
}

tasks.named('bootRun') {
    systemProperty 'user.timezone', 'UTC'
}

// application-local.yml is intentionally gitignored and may contain local secrets. It must
// never enter a production artifact even when a developer has created it under resources.
tasks.named('bootJar') {
    exclude('application-local.yml')
}

tasks.register('verifyBootJarNoLocalSecrets') {
    group = 'verification'
    description = 'Verify the executable jar contains no ignored local secret configuration.'
    dependsOn tasks.named('bootJar')
    doLast {
        def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def forbidden = zipTree(jarFile).files.findAll { file ->
            file.name == 'application-local.yml'
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException('bootJar must not contain application-local.yml')
        }
    }
}

tasks.register('verifyPostSearchText', JavaExec) {
    group = 'verification'
    description = 'Verify M7 post search text cache using an offline JDBC connection.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zeroverse.tools.PostSearchTextMaintenance'
    args 'verify'
}

tasks.register('rebuildPostSearchText', JavaExec) {
    group = 'verification'
    description = 'Rebuild M7 post search text cache after explicit offline/apply confirmation.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zeroverse.tools.PostSearchTextMaintenance'
    args 'rebuild'
    doFirst {
        if (project.findProperty('m7TextApply') != 'true'
                || project.findProperty('m7TextOffline') != 'true') {
            throw new GradleException(
                    'rebuildPostSearchText requires -Pm7TextApply=true -Pm7TextOffline=true')
        }
    }
}

tasks.register('cleanupUploadIntents', JavaExec) {
    group = 'operations'
    description = 'List expired upload intents (or delete with -PuploadCleanupApply=true).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zeroverse.tools.UploadIntentCleanup'
    systemProperty 'user.timezone', 'UTC'
    args '--spring.main.web-application-type=none'
    doFirst {
        if (project.findProperty('uploadCleanupApply') == 'true') {
            args '--upload.cleanup.apply=true'
        }
    }
}
