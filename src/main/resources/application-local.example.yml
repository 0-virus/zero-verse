# 로컬 개발용 설정 예시.
#
# 이 파일을 `application-local.yml`로 복사한 뒤 실제 값을 채운다.
# `application-local.yml`은 .gitignore 대상이며 절대 커밋하지 않는다.
#
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 요구 DB: MySQL 8.x (REQUIREMENTS §2). 스키마는 Flyway V1__init.sql이 생성한다.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zeroverse?serverTimezone=UTC&characterEncoding=UTF-8
    username: zeroverse
    password: "<로컬 비밀번호를 여기에>"

zeroverse:
  cors:
    allowed-origins: http://localhost:5173

  # JWT 서명 키 — 최소 256-bit(32바이트) 랜덤을 Base64로 넣는다.
  # 생성 예: openssl rand -base64 32
  # 이 값은 절대 커밋하지 않는다.
  jwt:
    secret-base64: "<Base64 인코딩된 32바이트 이상 랜덤 키>"

  auth:
    cookie:
      # ADR-0003 §3이 허용한 유일한 local 완화. 로컬은 http라 Secure 쿠키가 저장되지 않는다.
      secure: false
      # SameSite는 운영과 동일하게 Strict를 유지한다. 여기서 Lax로 내리면 로컬에서만 통과하고
      # 운영에서 깨지는 흐름을 못 잡는다.
      same-site: Strict
      allowed-origins:
        - http://localhost:5173
