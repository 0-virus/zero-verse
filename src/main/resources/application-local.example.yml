# 로컬 개발 환경 설정 예시
# 이 파일을 참고하여 application-local.yml을 생성하고, git 커밋하지 마세요.
# 참고: 스키마는 MySQL 8.x 호환입니다.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zeroverse?serverTimezone=UTC&characterEncoding=utf8mb4
    username: root
    password: root

aws:
  s3:
    # LocalStack 설정 (Docker S3 에뮬레이션)
    bucket-name: zeroverse-local
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    endpoint: http://localhost:4566
    use-path-style: true

jwt:
  secret: your-local-jwt-secret-key-keep-private

# 환경변수로도 설정 가능:
# export JWT_SECRET="your-secret-key"
# export AWS_S3_BUCKET="zeroverse-local"
# export AWS_ACCESS_KEY="minioadmin"
# export AWS_SECRET_KEY="minioadmin"
