spring:
  application:
    name: zeroverse-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zeroverse?serverTimezone=UTC&characterEncoding=utf8mb4}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600
  refresh-token-expiry: 1209600

auth:
  cookie:
    name: refresh_token
    path: /api/v1/auth
    secure: true
    same-site: Strict
    max-age: 1209600

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    endpoint: ${AWS_ENDPOINT:}
    use-path-style: ${AWS_USE_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
