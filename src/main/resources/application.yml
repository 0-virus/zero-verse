spring:
  application:
    name: zeroverse-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zeroverse?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:zeroverse}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

zeroverse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.zeroverse: INFO
