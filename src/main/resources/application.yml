spring:
  application:
    name: zeroverse

  profiles:
    active: local # application-local.yml을 추가로 읽음

  jpa:
    hibernate:
      ddl-auto: update    # 개발 환경에서만 사용 , 운영 시에는 validate
    show-sql: true        # SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true  # SQL 콘솔 출력 시 sql을 정렬하여 출력

jwt:
  secret: ${JWT_SECRET:zeroverse-local-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-ms: 3600000

server:
  port: 8000

logging:
  level:
    root: INFO
