# 테스트 공통 설정.
# datasource URL/계정은 Testcontainers가 @DynamicPropertySource로 주입한다(비밀값을 두지 않는다).

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

zeroverse:
  cors:
    allowed-origins: http://localhost:5173

  # 테스트 전용 고정 키. 운영 비밀로 사용할 수 없다.
  jwt:
    secret-base64: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLXplcm92ZXJzZS0yNTZiaXQh
    access-ttl: PT1H
    refresh-ttl: P14D

  auth:
    cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: false
      same-site: Lax
      allowed-origins:
        - http://localhost:5173

logging:
  level:
    com.zeroverse: INFO
    org.flywaydb: INFO
