# 테스트 공통 설정.
# datasource URL/계정은 Testcontainers가 @DynamicPropertySource로 주입한다(비밀값을 두지 않는다).

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

zeroverse:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.zeroverse: INFO
    org.flywaydb: INFO
