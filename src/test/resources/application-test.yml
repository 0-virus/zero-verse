spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zeroverse_test
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key
  access-token-expiry: 3600
  refresh-token-expiry: 1209600

cors:
  allowed-origins: http://localhost:5173

aws:
  s3:
    bucket-name: zeroverse-test
    region: us-east-1
    access-key: test-access-key
    secret-key: test-secret-key
    endpoint: http://localhost:4566
    use-path-style: true
